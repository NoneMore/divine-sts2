name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Sync development environment
        shell: pwsh
        run: pwsh ./dev.ps1 sync
      - name: Run source gate
        shell: pwsh
        run: pwsh ./dev.ps1 check
